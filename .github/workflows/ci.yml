name: RAY Control Plane CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Security, Migrations & Test Suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ray_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8 pip-audit

      - name: Verify Python Dependencies Integrity
        run: |
          python -m pip check

      - name: Python Syntax & Lint Verification
        run: |
          python -m compileall services/ apps/api/ apps/worker/ tests/
          flake8 services/ apps/api/ apps/worker/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic check

      - name: Run Financial Invariant Tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
          RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret_key_123456
        run: |
          pytest tests/invariants/ -v

      - name: Run Failure & Concurrency Tests (100-Thread Adversarial)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
          RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret_key_123456
        run: |
          pytest tests/failure/ tests/concurrency/ -v

      - name: Run Full Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
          RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret_key_123456
        run: |
          pytest -v tests/

  security-audit:
    name: Security Vulnerability & Secrets Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secrets Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run pip-audit Vulnerability Scanner
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend-verification:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run npm Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build

  e2e-testing:
    name: Playwright Browser End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ray_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Migrations & Seed Baseline Data
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          python scripts/generate_data.py --customers 50 --orders 100 --payments 100 --failed 20

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies & Playwright
        run: |
          npm ci --prefix apps/web
          npx --prefix apps/web playwright install --with-deps chromium

      - name: Start API and Web Server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ray_db
          ENVIRONMENT: test
          PORT: 8000
        run: |
          nohup uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:8000/health
          npm run build --prefix apps/web
          PORT=3000 nohup npm start --prefix apps/web > web.log 2>&1 &
          sleep 4
          curl -f http://127.0.0.1:3000

      - name: Run Playwright E2E Test Suite
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          CI: "true"
        run: |
          npx --prefix apps/web playwright test

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker-verification:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Developer Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml syntax is valid."

      - name: Validate Production Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci_test_postgres_password_min16chars!
          JWT_SECRET_KEY: ci_test_jwt_secret_key_production_grade_32ch!
          RAZORPAY_WEBHOOK_SECRET: ci_test_razorpay_webhook_secret_32ch!
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          echo "docker-compose.prod.yml syntax is valid."

      - name: Build Core Production Docker Images
        run: |
          docker build -f deploy/Dockerfile.api -t ray-api:ci .
          docker build -f deploy/Dockerfile.worker -t ray-worker:ci .
          echo "Production Docker images built successfully."
